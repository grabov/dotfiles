# --- Base ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 0
set -g history-limit 100000
set -g focus-events on
setw -g mode-keys vi

# Extended keys (CSI-u) for Shift+Enter etc.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Index windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the title the program sets (OSC 0/2) instead of the
# process name. tmux leaves pane_title at the hostname when nothing set one,
# so fall back to the command in that case (and while it is still empty).
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}"

# --- Prefix: Ctrl-a ---
unbind C-b
set -g prefix C-a
set -g prefix2 C-ф
bind C-a send-prefix
bind C-ф send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind щ source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Splits open in session start directory (default) ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind о select-pane -L
bind j select-pane -D
bind с select-pane -D
bind k select-pane -U
bind м select-pane -U
bind l select-pane -R
bind з select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r О resize-pane -L 5
bind -r J resize-pane -D 5
bind -r С resize-pane -D 5
bind -r K resize-pane -U 5
bind -r М resize-pane -U 5
bind -r L resize-pane -R 5
bind -r З resize-pane -R 5

# Window switching
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Prefix-less window / session management
bind -n M-s choose-tree -s
bind -n M-Enter new-window
bind -n M-q kill-window
bind -n M-c kill-pane
bind -n M-d detach

# Tab text: window name (auto-renamed from pane title, see above) + current dir
set -g @catppuccin_window_text " #W · #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #W · #{b:pane_current_path}"

# --- Vim-style copy mode ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi ю send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi е send -X copy-selection-and-cancel

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Plugin settings
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"


# Init TPM (must stay at the end)
run '~/.config/tmux/plugins/tpm/tpm'

# # Override catppuccin message style: opaque bg + left align,
# # otherwise the command prompt overlaps the status bar instead of replacing it
# set -g message-style "fg=#cdd6f4,bg=#313244"
# set -g message-command-style "fg=#cdd6f4,bg=#313244"
