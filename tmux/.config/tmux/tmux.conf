# Single tmux config for macOS and Arch. Lives at ~/.config/tmux/tmux.conf
# (tmux >= 3.1), TPM plugins go to ~/.config/tmux/plugins.

# --- Base ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:RGB"
set -sg escape-time 0
set -g history-limit 100000
set -g focus-events on
setw -g mode-keys vi
set -g pane-border-lines "double"

# Extended keys (CSI-u) for Shift+Enter etc.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Index windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the title the program sets (OSC 0/2) instead of the
# process name. tmux leaves pane_title at the hostname when nothing set one,
# so fall back to the command in that case (and while it is still empty).
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}"

# --- Prefix: Ctrl-a (also works in the Russian layout) ---
unbind C-b
set -g prefix C-a
set -g prefix2 C-ф
bind C-a send-prefix
bind C-ф send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind щ source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Splits open in session start directory (default) ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind -n M-h split-window -v
bind -n M-v split-window -h

# Vim-style pane navigation
bind h select-pane -L
bind о select-pane -L
bind j select-pane -D
bind с select-pane -D
bind k select-pane -U
bind м select-pane -U
bind l select-pane -R
bind з select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes
bind -r H resize-pane -L 5
bind -r О resize-pane -L 5
bind -r J resize-pane -D 5
bind -r С resize-pane -D 5
bind -r K resize-pane -U 5
bind -r М resize-pane -U 5
bind -r L resize-pane -R 5
bind -r З resize-pane -R 5
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

# Window switching: Left/Right walk the status line, Up/Down walk panes.
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Prefix-less window / session management
bind -n M-s choose-tree -s
bind -n M-Enter new-window
bind -n M-q kill-window
bind -n M-c kill-pane
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

# Search straight from the shell
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

# --- Clipboard ---
# System clipboard: last matching line wins, so Wayland beats X11 and
# macOS beats both (brew may install xclip there too).
if-shell 'command -v xclip'   "set -s copy-command 'xclip -selection clipboard'"
if-shell 'command -v wl-copy' "set -s copy-command 'wl-copy'"
if-shell 'command -v pbcopy'  "set -s copy-command 'pbcopy'"

# Vim-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi ю send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi е send -X copy-pipe-and-cancel

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Tab text: window name (auto-renamed from pane title, see above) + current dir
set -g @catppuccin_window_text " #W · #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #W · #{b:pane_current_path}"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Bootstrap TPM and plugins on a fresh machine.
if-shell 'test ! -d ~/.config/tmux/plugins/tpm' \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Init TPM (must stay at the end)
run '~/.config/tmux/plugins/tpm/tpm'
