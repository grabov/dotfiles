unbind-key -a -T root

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB"

set -g pane-border-lines "double"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the title the program sets (OSC 0/2) instead of the
# process name. tmux leaves pane_title at the hostname when nothing set one,
# so fall back to the command in that case (and while it is still empty).
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}"

setw -g mode-keys vi

set -g mouse on

set -g focus-events on

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Left/Right ходят по окнам (строка статуса внизу), Up/Down — по панелям
# внутри окна.
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-Enter new-window
bind -n M-c kill-pane
bind -n M-q kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

# System clipboard: last matching line wins, so Wayland beats X11 and
# macOS beats both (brew may install xclip there too).
if-shell 'command -v xclip'   "set -s copy-command 'xclip -selection clipboard'"
if-shell 'command -v wl-copy' "set -s copy-command 'wl-copy'"
if-shell 'command -v pbcopy'  "set -s copy-command 'pbcopy'"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W · #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #W · #{b:pane_current_path}"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Bootstrap TPM and plugins on a fresh machine.
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
